<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Academic Shield Shape -->
  <g filter="url(#shadow)">
    <path d="M 256 70 
             Q 360 70 400 130 
             C 400 280 340 370 256 430 
             C 172 370 112 280 112 130 
             Q 152 70 256 70 Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#goldGrad)" 
          stroke-width="10"/>
  </g>

  <!-- Laurel Wreath & Star Highlights -->
  <circle cx="256" cy="115" r="10" fill="#fbbf24"/>
  <polygon points="256,92 262,108 278,108 265,118 270,134 256,124 242,134 247,118 234,108 250,108" fill="url(#goldGrad)"/>

  <!-- Open Book Iconography -->
  <g fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Page -->
    <path d="M 256 220 C 220 205 170 205 150 215 L 150 325 C 170 315 220 315 256 330 Z" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Right Page -->
    <path d="M 256 220 C 292 205 342 205 362 215 L 362 325 C 342 315 292 315 256 330 Z" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Page text lines -->
    <line x1="175" y1="245" x2="235" y2="245" stroke="#94a3b8" stroke-width="4"/>
    <line x1="175" y1="265" x2="235" y2="265" stroke="#94a3b8" stroke-width="4"/>
    <line x1="175" y1="285" x2="220" y2="285" stroke="#94a3b8" stroke-width="4"/>
    <line x1="277" y1="245" x2="337" y2="245" stroke="#94a3b8" stroke-width="4"/>
    <line x1="277" y1="265" x2="337" y2="265" stroke="#94a3b8" stroke-width="4"/>
    <line x1="277" y1="285" x2="322" y2="285" stroke="#94a3b8" stroke-width="4"/>
  </g>

  <!-- Mortarboard Cap -->
  <g transform="translate(256, 175) scale(0.95)">
    <!-- Diamond board -->
    <polygon points="0,-35 80,0 0,35 -80,0" fill="url(#goldGrad)" stroke="#78350f" stroke-width="3"/>
    <!-- Cap skull base -->
    <path d="M -45 5 L -45 28 C -45 42 45 42 45 28 L 45 5 Z" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="3"/>
    <!-- Tassel ribbon -->
    <path d="M 0 0 Q 60 15 65 50" fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="65" cy="52" r="5" fill="#fef08a"/>
  </g>

  <!-- Typography: SMS Monogram Banner -->
  <rect x="160" y="360" width="192" height="46" rx="8" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3"/>
  <text x="256" y="393" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="24" 
        font-weight="900" 
        fill="#fbbf24" 
        text-anchor="middle" 
        letter-spacing="5">SCHOOL SMS</text>
</svg>
